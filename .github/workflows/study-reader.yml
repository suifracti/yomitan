name: Study reader integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/study-reader.yml'
permissions:
  contents: read
jobs:
  dependencies:
    if: github.repository == 'suifracti/yomitan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile without package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Package verification dependencies
        run: tar -czf study-node-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: study-reader-dependencies
          path: study-node-deps.tar.gz
          retention-days: 1
