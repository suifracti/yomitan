<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Yomitan · 学习库</title>
    <link rel="icon" type="image/png" href="/images/icon32.png" sizes="32x32">
    <link rel="stylesheet" type="text/css" href="/js/study/study-tokens.css">
    <link rel="stylesheet" href="/css/study-library.css">
    <script src="/js/pages/study-library.js" type="module"></script>
</head>
<body>
    <main>
        <nav class="study-library-nav" aria-label="主导航">
            <a href="/search.html">查词</a>
            <a href="/study-library.html" aria-current="page">学习库</a>
            <a href="/settings.html#save">设置</a>
        </nav>
        <header>
            <div><h1>学习库</h1><p>接着原来的词句、笔记与复习状态学习。</p></div>
        </header>
        <div class="study-library-today">
            <p id="study-library-today" hidden></p>
            <button type="button" id="study-library-open-anki" hidden>打开 Anki</button>
        </div>
        <p id="study-library-status" role="status" aria-live="polite">正在读取学习库…</p>
        <section class="study-library-tools" aria-label="学习库筛选">
            <div class="study-library-tabs">
                <button type="button" data-library-category="all" aria-pressed="true">全部</button>
                <button type="button" data-library-category="favorites" aria-pressed="false">收藏</button>
                <button type="button" data-library-category="saved" aria-pressed="false">已保存</button>
                <button type="button" data-library-category="linked" aria-pressed="false">关联卡</button>
                <button type="button" data-library-category="pending" aria-pressed="false">待同步</button>
            </div>
            <label for="study-library-search">搜索已读取记录</label>
            <input id="study-library-search" type="search" placeholder="查词、原句、来源、笔记路径…" autocomplete="off">
            <div class="study-library-toolbar-actions"><button type="button" id="study-library-refresh">刷新列表</button></div>
        </section>
        <details class="study-library-collection" aria-label="收藏管理">
            <summary>收藏管理 · 导出与清理</summary>
            <div class="study-library-collection-body">
                <div>
                    <p>管理扩展中已收集的收藏，包含已读取的同步收藏；未加载的原生收藏不会自动读入。清除只取消收藏标记，不删除笔记或卡片。</p>
                </div>
                <div class="study-library-collection-actions">
                    <button type="button" id="study-library-export-saved">导出已收集收藏</button>
                    <button type="button" id="study-library-clear-saved">清空已收集收藏</button>
                </div>
            </div>
        </details>
        <section id="study-library-list" aria-live="polite"><p class="study-library-empty">正在读取学习库…</p></section>
        <button type="button" id="study-library-more" class="study-library-more" hidden>加载更多</button>
    </main>
</body>
</html>
