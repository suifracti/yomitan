<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Yomitan · 学习库</title>
    <link rel="icon" type="image/png" href="/images/icon32.png" sizes="32x32">
    <link rel="stylesheet" type="text/css" href="/js/study/study-tokens.css">
    <link rel="stylesheet" href="/css/study-library.css">
    <script src="/js/pages/study-library.js" type="module"></script>
</head>
<body data-study-ui>
    <main>
        <header>
            <div><h1>学习库</h1><p>接着原来的词句、笔记与复习状态学习。</p></div>
            <a class="study-page-link" href="/settings.html#save">设置 ↗</a>
        </header>
        <div class="study-library-today">
            <p id="study-library-today" hidden></p>
            <button type="button" id="study-library-open-anki" hidden>打开 Anki</button>
        </div>
        <p id="study-library-status" role="status" aria-live="polite">正在读取学习库…</p>
        <details id="study-library-old-updates" class="study-library-collection" hidden>
            <summary>待核对的改动</summary>
            <p>有些改动还没写进笔记：原笔记在别处改过，或旧版本没记清要补到哪里。原笔记和本机草稿都保留，核对后再复制过去。</p>
            <div data-study-review-links></div>
            <textarea readonly rows="7" aria-label="留在本机的改动"></textarea>
            <button type="button">复制待核对内容</button>
        </details>
        <section class="study-library-tools" aria-label="学习库筛选">
            <div class="study-library-tabs">
                <button type="button" data-library-category="all" aria-pressed="true">全部</button>
                <button type="button" data-library-category="sources" aria-pressed="false">按素材</button>
                <button type="button" data-library-category="source" aria-pressed="false" hidden>同来源原句</button>
                <button type="button" data-library-category="word" aria-pressed="false" hidden>同词原句</button>
                <button type="button" data-library-category="favorites" aria-pressed="false">收藏</button>
                <button type="button" data-library-category="saved" aria-pressed="false">已保存</button>
                <button type="button" data-library-category="recent-recall" aria-pressed="false">最近没认出</button>
                <button type="button" data-library-category="linked" aria-pressed="false">关联卡</button>
                <button type="button" data-library-category="pending" aria-pressed="false">需处理 0</button>
                <button type="button" data-library-category="manual-known" aria-pressed="false">我标为认识的</button>
                <button type="button" data-library-category="anki-only" aria-pressed="false">只在 Anki</button>
            </div>
            <label for="study-library-search">搜索学习库</label>
            <input id="study-library-search" type="search" placeholder="搜原句、来源或几个线索，如：charge 收费" maxlength="240" autocomplete="off">
            <div class="study-library-toolbar-actions">
                <button type="button" id="study-library-practice-button" aria-controls="study-library-practice" aria-expanded="false" hidden>用旧原句辨词义</button>
                <button type="button" id="study-library-cloze-button" aria-controls="study-library-practice" aria-expanded="false" hidden>练原句填空</button>
                <button type="button" id="study-library-dictation-button" aria-controls="study-library-practice" aria-expanded="false" hidden>练原声听写</button>
                <button type="button" id="study-library-listen-source" hidden>回视频练一轮</button>
                <button type="button" id="study-library-refresh">刷新列表</button>
            </div>
        </section>
        <section id="study-library-practice" class="study-library-practice" aria-label="用旧原句练习" hidden></section>
        <details class="study-library-collection" aria-label="收藏管理">
            <summary>收藏管理 · 导出与清理</summary>
            <div class="study-library-collection-body">
                <div>
                    <p>管理扩展中已收集的收藏，包含已读取的同步收藏；未加载的原生收藏不会自动读入。清除只取消收藏标记，不删除笔记或卡片。</p>
                </div>
                <div class="study-library-collection-actions">
                    <button type="button" id="study-library-export-saved">导出已收集收藏</button>
                    <button type="button" id="study-library-clear-saved">清空已收集收藏</button>
                </div>
            </div>
        </details>
        <section id="study-library-list" aria-live="polite"><p class="study-library-empty">正在读取学习库…</p></section>
        <button type="button" id="study-library-more" class="study-library-more" hidden>加载更多</button>
    </main>
</body>
</html>
