<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>英语学习</title>
    <link rel="icon" type="image/png" href="/images/icon16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="/images/icon19.png" sizes="19x19">
    <link rel="icon" type="image/png" href="/images/icon32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/images/icon38.png" sizes="38x38">
    <link rel="icon" type="image/png" href="/images/icon48.png" sizes="48x48">
    <link rel="icon" type="image/png" href="/images/icon64.png" sizes="64x64">
    <link rel="icon" type="image/png" href="/images/icon128.png" sizes="128x128">
    <link rel="stylesheet" type="text/css" href="/css/material.css">
    <link rel="stylesheet" type="text/css" href="/js/study/study-tokens.css">
    <link rel="stylesheet" type="text/css" href="/css/action-popup.css">
    <script src="/js/pages/action-popup-main.js" type="module"></script>
    <script src="/js/pages/common/zh-cn-ui.js" type="module"></script>
</head>
<body>
    <div id="loading">
        正在打开…
    </div>
    <div id="action-popup">
        <header class="action-heading">
            <h1>英语学习</h1>
            <label class="toggle"><input type="checkbox" class="enable-search" aria-label="划词查询"><span class="toggle-body"><span class="toggle-track"></span><span class="toggle-knob"></span></span></label>
        </header>
        <p class="scan-state" role="status">正在读取设置…</p>
        <p class="tooltip">按住 Ctrl，鼠标移到单词上即可查询</p>
        <section class="page-quick-controls">
            <button type="button" id="page-toggle">翻译本页</button>
            <small id="page-selection-hint">选中句子点「译」；鼠标停在段落上按 Alt 翻译这一段</small>
            <select id="page-mode" aria-label="翻译形式"><option value="bilingual">双语</option><option value="translation">只看译文</option></select>
            <label><input type="checkbox" id="page-site">总是翻译这个网站</label>
            <label><input type="checkbox" id="page-auto">英文网页自动翻译</label>
            <label><input type="checkbox" id="page-marks">网页生词标色</label>
            <button type="button" id="action-page-words">本页生词（…） →</button>
            <label><input type="checkbox" id="page-video">视频字幕学习</label>
        </section>
        <div class="action-buttons">
            <a class="action-open-study-library" href="/study-library.html" target="_blank"><strong>学习库</strong><span id="action-today" hidden></span></a>
            <a class="action-open-settings" href="/settings.html">设置</a>
        </div>
        <footer><a class="action-open-info" href="/info.html">帮助 ↗</a></footer>
    </div>
</body>
</html>
