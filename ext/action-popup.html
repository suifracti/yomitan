<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>英语学习</title>
    <link rel="icon" type="image/png" href="/images/icon16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="/images/icon19.png" sizes="19x19">
    <link rel="icon" type="image/png" href="/images/icon32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/images/icon38.png" sizes="38x38">
    <link rel="icon" type="image/png" href="/images/icon48.png" sizes="48x48">
    <link rel="icon" type="image/png" href="/images/icon64.png" sizes="64x64">
    <link rel="icon" type="image/png" href="/images/icon128.png" sizes="128x128">
    <link rel="stylesheet" type="text/css" href="/css/material.css">
    <link rel="stylesheet" type="text/css" href="/js/study/study-tokens.css">
    <link rel="stylesheet" type="text/css" href="/css/action-popup.css">
    <script src="/js/pages/action-popup-main.js" type="module"></script>
    <script src="/js/pages/common/zh-cn-ui.js" type="module"></script>
</head>
<body data-study-ui>
    <div id="loading">
        正在打开…
    </div>
    <div id="action-popup">
        <header class="action-heading"><h1>英语学习</h1></header>
        <section class="page-quick-controls" aria-labelledby="popup-translation-title">
            <h2 id="popup-translation-title">翻译</h2>
            <button type="button" id="page-toggle">翻译本页</button>
            <select id="page-engine" aria-label="翻译服务"><option value="google">Google 免费翻译（需要联网）</option><option value="chrome">Chrome 内置翻译（首次使用需要下载语言包）</option><option value="apple">Apple 翻译</option><option value="model">AI 模型</option></select>
            <select id="page-mode" aria-label="翻译形式"><option value="bilingual">双语</option><option value="translation">只看译文</option></select>
            <label><input type="checkbox" id="page-site">总是翻译这个网站</label>
            <label><input type="checkbox" id="page-auto">英文网页自动翻译</label>
        </section>
        <section class="page-quick-controls" aria-labelledby="popup-learning-title">
            <h2 id="popup-learning-title">学习</h2>
            <div class="popup-row scan-row">
                <span>划词查询</span>
                <label class="toggle"><input type="checkbox" class="enable-search" aria-label="划词查询"><span class="toggle-body"><span class="toggle-track"></span><span class="toggle-knob"></span></span></label>
            </div>
            <p class="scan-state" role="status" hidden></p>
            <p class="tooltip" hidden>按住 Ctrl，鼠标移到单词上即可查询</p>
            <div class="popup-row">
                <span>网页生词标色</span>
                <button type="button" id="action-page-words">本页 … 个 ›</button>
                <label class="toggle"><input type="checkbox" id="page-marks" aria-label="网页生词标色"><span class="toggle-body"></span></label>
            </div>
            <label><input type="checkbox" id="page-video">视频字幕学习</label>
        </section>
        <p class="ball-restore"><a id="page-ball-restore" hidden></a></p>
        <footer>
            <a class="action-open-study-library" href="/study-library.html" target="_blank">学习库<span id="action-today" hidden></span></a>
            <span aria-hidden="true"> · </span><a class="action-open-settings" href="/settings.html">设置</a>
            <span aria-hidden="true"> · </span><a class="action-open-info" href="/info.html">帮助</a>
        </footer>
    </div>
</body>
</html>
